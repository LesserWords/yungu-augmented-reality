<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Yungu · Modo joystick</title>
  <meta name="theme-color" content="#040c18" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="play">
  <!-- 3D canvas is inserted here by src/play/main.js -->

  <section id="start" class="start" aria-labelledby="start-title">
    <div class="start-card">
      <img src="img/icon-192.png" alt="" width="72" height="72" class="start-icon" />
      <h1 id="start-title">Modo <span class="lime">joystick</span></h1>
      <p class="start-text">Coloque o Yungu no chão e leve ele para passear pelo ambiente.</p>
      <ol class="steps">
        <li>Aponte a câmera para o chão</li>
        <li>O Yungu aparece na sua frente</li>
        <li>Use o joystick para mover</li>
      </ol>
      <button id="start-btn" class="btn btn-primary" type="button" disabled>Carregando…</button>
      <p id="start-note" class="start-note" hidden></p>
      <a class="back-link" href="./">← Voltar</a>
    </div>
  </section>

  <!-- HUD: also used as the WebXR DOM overlay while in AR -->
  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <button id="btn-exit" class="icon-btn" type="button" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <p id="status" class="status" aria-live="polite"></p>
    </div>

    <div class="hud-bottom">
      <div id="joystick" class="joystick" aria-label="Joystick" role="application">
        <div class="joy-ring"></div>
        <div class="joy-knob"></div>
      </div>

      <div class="hud-actions">
        <button id="btn-wave" class="round-btn round-btn-lime" type="button" aria-label="Acenar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L4 15.2a1.6 1.6 0 0 1 2.4-2.1L7 13.7V11"/></svg>
        </button>
        <div class="size-group">
          <button id="btn-bigger" class="round-btn" type="button" aria-label="Aumentar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-smaller" class="round-btn" type="button" aria-label="Diminuir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
        </div>
        <button id="btn-relocate" class="round-btn" type="button" aria-label="Trazer o Yungu de volta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/play/main.js"></script>
</body>
</html>
